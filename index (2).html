<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan de la médina de Kairouan</title>
<style>
:root{--bg:#10243d;--bg2:#1b4f8a;--sand:#e0b872;--ink:#f6efe0;box-sizing:border-box}
*{box-sizing:inherit;margin:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,'Segoe UI',Tahoma,serif}
[dir=rtl]{font-family:'Segoe UI',Tahoma,'Noto Naskh Arabic',serif}
body{position:relative;overflow-x:hidden;background:radial-gradient(ellipse at 15% 0,var(--bg2),var(--bg) 65%) fixed;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.28;pointer-events:none;animation:fl 14s ease-in-out infinite alternate}
.o1{width:300px;height:300px;background:#e0b872;top:-60px;right:-80px}.o2{width:360px;height:360px;background:#2e86de;bottom:-120px;left:-100px;animation-duration:19s}
@keyframes fl{to{transform:translate(50px,60px) scale(1.25)}}
.tb{position:relative;display:flex;justify-content:space-between;max-width:1100px;margin:0 auto 14px;direction:ltr;z-index:2}
button{background:rgba(255,255,255,.12);color:var(--ink);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit;transition:.2s}
button:hover{background:rgba(255,255,255,.22)}button.on{background:var(--sand);color:#222;font-weight:700}
main{position:relative;max-width:1100px;margin:auto;z-index:1}
header{text-align:center;margin-bottom:16px;animation:in .8s both}
@keyframes in{from{opacity:0;transform:translateY(22px)}}
h1{font-size:clamp(26px,5.5vw,48px);color:var(--sand);line-height:1.15;background:linear-gradient(90deg,#e0b872,#fff3d0,#e0b872);background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-200%}}
.sub{opacity:.85;font-size:clamp(15px,2.6vw,21px);margin-top:6px}
.g{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
@media(max-width:800px){.g{grid-template-columns:1fr}}
.map{position:relative;border-radius:16px;overflow:hidden;border:3px solid rgba(224,184,114,.8);box-shadow:0 14px 40px rgba(0,0,0,.55);background:#fff;cursor:crosshair;touch-action:pan-y;animation:rv 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes rv{from{clip-path:inset(0 100% 0 0);opacity:0}}
.map img{display:block;width:100%;height:auto}
.map .ly{position:absolute;inset:0;opacity:0;transition:opacity .6s;pointer-events:none}
.map[data-z=m] .dm,.map[data-z=m] .gm,.map[data-z=f] .df,.map[data-z=f] .gf{opacity:1}
.map[data-z] .gm,.map[data-z] .gf{animation:pu 1.6s ease-in-out infinite alternate}
@keyframes pu{from{filter:brightness(.9)}to{filter:brightness(1.9)}}
.lens{position:absolute;width:150px;height:150px;border-radius:50%;border:3px solid var(--sand);box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .2s;background-repeat:no-repeat;background-color:#fff}
.map.z .lens{opacity:1}
.bar{height:4px;background:rgba(255,255,255,.15);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--sand)}.bar i.r{animation:pg 5s linear forwards}@keyframes pg{to{width:100%}}
.hint{text-align:center;font-size:13px;opacity:.75;margin-top:8px}
.side{display:grid;gap:12px}
.card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px 16px;animation:in .7s both;backdrop-filter:blur(6px)}
.card:nth-child(2){animation-delay:.2s}.card:nth-child(3){animation-delay:.4s}.card:nth-child(4){animation-delay:.6s}
.card b{display:block;font-size:34px;color:var(--sand)}
.card p{font-size:clamp(15px,2.2vw,18px);line-height:1.55}
.info{min-height:130px;border-color:var(--sand)}.info h3{color:var(--sand);font-size:20px;margin-bottom:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.dt{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;z-index:9;align-items:center;justify-content:center}#lb.o{display:flex}#lb img{max-width:96%;max-height:94%;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
